services:
  db:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_DB: closetwise
      POSTGRES_USER: closetwise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-password}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U closetwise -d closetwise"]
      interval: 5s
      timeout: 5s
      retries: 12
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://closetwise:${POSTGRES_PASSWORD:-local-development-password}@db:5432/closetwise
      AUTH_SECRET: ${AUTH_SECRET:-development-only-change-this-secret-32-characters}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      DEMO_ENABLED: ${DEMO_ENABLED:-true}
      RECOGNITION_PROVIDER: ${RECOGNITION_PROVIDER:-mock}
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_MODEL: ${VISION_MODEL:-gpt-4.1-mini}
      VISION_URL: ${VISION_URL:-https://api.openai.com/v1/chat/completions}
      STORAGE_PATH: /app/data/images
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    volumes: ["images:/app/data/images"]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    depends_on:
      backend: { condition: service_healthy }
volumes:
  pgdata:
  images:
